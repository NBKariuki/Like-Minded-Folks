<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080b0f">
<title>Like-Minded Folks · MMF</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --font-display: 'Sora', sans-serif;
  --font-sans: 'DM Sans', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --ac: #56c252;
  --ac-soft: rgba(86, 194, 82, 0.14);
  --ac-border: rgba(86, 194, 82, 0.32);
  --bl: #4b91ff;
  --bl-soft: rgba(75, 145, 255, 0.14);
  --gd: #ffaa2b;
  --gd-soft: rgba(255, 170, 43, 0.14);
  --rd: #ff4d6d;
  --rd-soft: rgba(255, 77, 109, 0.14);

  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --tr: 0.22s cubic-bezier(0.22, 1, 0.36, 1);
}

[data-theme="dark"] {
  --bg: #080b0f;
  --card: rgba(20, 26, 36, 0.88);
  --card-solid: #141a24;
  --card-alt: #1a2230;
  --br: rgba(255, 255, 255, 0.08);
  --br-strong: rgba(255, 255, 255, 0.16);
  --t1: #f2f5fa;
  --t2: rgba(242, 245, 250, 0.68);
  --t3: rgba(242, 245, 250, 0.42);
  --glass-shine: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01) 55%, rgba(86,194,82,0.04));
  --shadow-card: 0 12px 32px rgba(0, 0, 0, 0.42);
  --shadow-dock: 0 16px 40px rgba(0, 0, 0, 0.58);
  --input-bg: rgba(255, 255, 255, 0.05);
}

[data-theme="light"] {
  --bg: #edf1ef;
  --card: rgba(255, 255, 255, 0.92);
  --card-solid: #ffffff;
  --card-alt: #f4f7f5;
  --br: rgba(15, 23, 42, 0.08);
  --br-strong: rgba(15, 23, 42, 0.15);
  --t1: #0f172a;
  --t2: rgba(15, 23, 42, 0.7);
  --t3: rgba(15, 23, 42, 0.46);
  --glass-shine: linear-gradient(145deg, rgba(255,255,255,0.9), rgba(255,255,255,0.5) 60%, rgba(86,194,82,0.05));
  --shadow-card: 0 10px 28px rgba(15, 23, 42, 0.07);
  --shadow-dock: 0 14px 34px rgba(15, 23, 42, 0.14);
  --input-bg: rgba(15, 23, 42, 0.04);
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: var(--font-sans);
  background: radial-gradient(circle at 50% -10%, var(--ac-soft), transparent 48%), var(--bg);
  color: var(--t1);
  min-height: 100svh;
  transition: background var(--tr), color var(--tr);
}

button, input, select {
  font-family: inherit;
  touch-action: manipulation;
}

.app-shell {
  max-width: 440px;
  margin: 0 auto;
  min-height: 100svh;
  padding-bottom: 108px;
}

/* Password screen */
.pw-wrap {
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.pw-box {
  width: 100%;
  max-width: 360px;
  padding: 32px 24px;
  border-radius: var(--radius-lg);
  background: var(--glass-shine), var(--card);
  border: 1px solid var(--br-strong);
  box-shadow: var(--shadow-card);
  text-align: center;
}

.pw-input {
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--br-strong);
  background: var(--input-bg);
  color: var(--t1);
  font-size: 0.95rem;
  outline: none;
  margin-top: 14px;
}

.pw-input:focus { border-color: var(--ac); }
.pw-input.err { border-color: var(--rd); }

/* Header */
.top-hdr {
  padding: 20px 20px 10px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ac);
}

.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ac);
  box-shadow: 0 0 8px var(--ac);
}

.brand-title {
  font-family: var(--font-display);
  font-size: 1.65rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin-top: 3px;
}

.brand-sub {
  font-size: 0.82rem;
  color: var(--t2);
  margin-top: 2px;
}

.hdr-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.chip-btn {
  padding: 7px 11px;
  border-radius: 999px;
  border: 1px solid var(--br-strong);
  background: var(--card-solid);
  color: var(--t2);
  font-size: 0.72rem;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--tr);
}

.chip-btn.active {
  background: var(--ac-soft);
  border-color: var(--ac-border);
  color: var(--ac);
}

.theme-toggle {
  width: 50px;
  height: 28px;
  border-radius: 999px;
  background: var(--input-bg);
  border: 1px solid var(--br-strong);
  padding: 3px;
  display: flex;
  align-items: center;
  cursor: pointer;
  transition: all var(--tr);
}

.theme-knob {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--card-solid);
  color: var(--t1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.72rem;
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  transition: transform var(--tr);
}

[data-theme="light"] .theme-knob { transform: translateX(22px); }

/* Greeting strip */
.greeting-card {
  margin: 6px 16px 12px;
  padding: 12px 15px;
  border-radius: var(--radius-md);
  background: var(--card);
  border: 1px solid var(--br);
  font-size: 0.85rem;
  line-height: 1.45;
  color: var(--t2);
}

/* Sticky segmented bar */
.seg-wrap {
  position: sticky;
  top: 0;
  z-index: 30;
  padding: 8px 16px 12px;
  background: linear-gradient(to bottom, var(--bg) 75%, transparent);
  backdrop-filter: blur(10px);
}

.seg-track {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  padding: 4px;
  border-radius: 999px;
  background: var(--card-solid);
  border: 1px solid var(--br-strong);
  box-shadow: var(--shadow-card);
}

.seg-btn {
  border: none;
  background: transparent;
  color: var(--t3);
  font-size: 0.8rem;
  font-weight: 700;
  padding: 9px 10px;
  border-radius: 999px;
  cursor: pointer;
  transition: all var(--tr);
}

.seg-btn.active {
  background: var(--ac);
  color: #061509;
  box-shadow: 0 4px 14px rgba(86, 194, 82, 0.32);
}

/* Month selector */
.month-bar {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 2px 16px 14px;
  scrollbar-width: none;
}

.month-bar::-webkit-scrollbar { display: none; }

.m-pill {
  padding: 6px 13px;
  border-radius: 999px;
  border: 1px solid var(--br);
  background: var(--card-solid);
  color: var(--t3);
  font-size: 0.76rem;
  font-weight: 700;
  cursor: pointer;
  flex-shrink: 0;
  transition: all var(--tr);
}

.m-pill.active {
  background: var(--ac-soft);
  border-color: var(--ac-border);
  color: var(--ac);
}

/* Cards */
.surface-card {
  margin: 0 16px 14px;
  padding: 20px;
  border-radius: var(--radius-lg);
  background: var(--glass-shine), var(--card);
  border: 1px solid var(--br-strong);
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(18px);
}

.hero-kicker {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--t3);
  text-align: center;
}

.hero-total {
  font-family: var(--font-display);
  font-size: 2.1rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  text-align: center;
  margin: 6px 0 10px;
  font-variant-numeric: tabular-nums;
}

.hero-badge-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  font-size: 0.8rem;
  color: var(--t2);
}

.pill-green {
  background: var(--ac-soft);
  color: var(--ac);
  border: 1px solid var(--ac-border);
  padding: 3px 10px;
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 0.74rem;
  font-weight: 700;
}

.stat-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--br);
}

.mini-stat {
  padding: 12px;
  border-radius: var(--radius-sm);
  background: var(--input-bg);
  border: 1px solid var(--br);
}

.mini-stat-lbl {
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--t3);
}

.mini-stat-val {
  font-family: var(--font-mono);
  font-size: 0.96rem;
  font-weight: 700;
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
}

.action-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 0 16px 14px;
}

.action-tile {
  padding: 14px;
  border-radius: var(--radius-md);
  background: var(--card-solid);
  border: 1px solid var(--br-strong);
  color: var(--t1);
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  text-align: left;
  box-shadow: var(--shadow-card);
  transition: transform 0.14s ease, border-color var(--tr);
}

.action-tile:active { transform: scale(0.97); }
.action-tile:hover { border-color: var(--ac-border); }

.tile-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  flex-shrink: 0;
}

.tile-title { font-size: 0.82rem; font-weight: 700; line-height: 1.25; }
.tile-sub { font-size: 0.7rem; color: var(--t3); margin-top: 2px; }

/* Alias picker */
.alias-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.alias-card {
  padding: 12px 8px;
  border-radius: var(--radius-md);
  background: var(--input-bg);
  border: 1px solid var(--br);
  color: var(--t1);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  transition: all var(--tr);
}

.alias-card:hover, .alias-card.selected {
  background: var(--ac-soft);
  border-color: var(--ac-border);
}

.alias-emoji { font-size: 1.3rem; }
.alias-name { font-size: 0.76rem; font-weight: 700; }

/* Balance breakdown */
.bal-hero {
  padding: 16px;
  border-radius: var(--radius-md);
  background: var(--ac-soft);
  border: 1px solid var(--ac-border);
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

.bal-hero-num {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--ac);
  font-variant-numeric: tabular-nums;
}

.kv-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 0;
  border-bottom: 1px solid var(--br);
  font-size: 0.88rem;
}

.kv-row:last-child { border-bottom: none; }
.kv-lbl { color: var(--t2); }
.kv-val {
  font-family: var(--font-mono);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* Table */
.tbl-card {
  margin: 0 16px 14px;
  border-radius: var(--radius-lg);
  background: var(--card-solid);
  border: 1px solid var(--br-strong);
  overflow-x: auto;
  box-shadow: var(--shadow-card);
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 340px;
  font-size: 0.78rem;
}

th {
  padding: 10px 8px;
  font-size: 0.66rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--t3);
  background: var(--card-alt);
  border-bottom: 1px solid var(--br);
  text-align: right;
}

th:first-child, th:nth-child(2) { text-align: left; }
th:first-child, td:first-child { padding-left: 12px; }
th:last-child, td:last-child { padding-right: 12px; }

td {
  padding: 9px 8px;
  border-bottom: 1px solid var(--br);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

td:first-child, td:nth-child(2) { text-align: left; }
td.mono { font-family: var(--font-mono); font-size: 0.72rem; }

.status-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  margin-left: 5px;
}

.primary-btn {
  width: 100%;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  border: none;
  background: var(--ac);
  color: #061509;
  font-size: 0.86rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, opacity 0.15s ease;
}

.primary-btn:active { transform: scale(0.98); }

.info-box {
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  background: var(--input-bg);
  border: 1px solid var(--br);
  font-size: 0.82rem;
  line-height: 1.55;
  color: var(--t2);
  margin-bottom: 10px;
}

.rule-item {
  padding: 9px 0;
  border-bottom: 1px solid var(--br);
  font-size: 0.85rem;
  color: var(--t2);
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.rule-item:last-child { border-bottom: none; }
.rule-item strong { color: var(--t1); }

.loader-box {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--t2);
}

.spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--br-strong);
  border-top-color: var(--ac);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Floating Bottom Dock */
.bottom-dock {
  position: fixed;
  bottom: max(12px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 28px);
  max-width: 400px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  padding: 5px;
  border-radius: 999px;
  background: var(--card);
  border: 1px solid var(--br-strong);
  backdrop-filter: blur(22px);
  box-shadow: var(--shadow-dock);
  z-index: 50;
}

.dock-item {
  border: none;
  background: transparent;
  color: var(--t3);
  padding: 7px 6px;
  border-radius: 999px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 0.68rem;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--tr);
}

.dock-item.active {
  background: var(--ac-soft);
  color: var(--ac);
}

.dock-icon { font-size: 1rem; line-height: 1; }
</style>
</head>

const MONTH_URLS = {};
MONTHS.forEach((m, i) => { MONTH_URLS[m] = atob(URLS[i]); });

const MIN_CONTRIB = 4000;
const ETICA_MONTHLY = 0.12 / 12;
const PASSWORD = 'LikeMinded2026';
const AUTH_DAYS = 30;
const CUR_YEAR = new Date().getFullYear();

function curMonth() { return MONTHS[new Date().getMonth()]; }

function getAuth() {
  try {
    const raw = localStorage.getItem('mmf_auth');
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (Date.now() > parsed.exp) { localStorage.removeItem('mmf_auth'); return null; }
    return parsed;
  } catch (e) { return null; }
}

function setAuth() {
  localStorage.setItem('mmf_auth', JSON.stringify({ ok: true, exp: Date.now() + AUTH_DAYS * 86400000 }));
}

function parseRow(line) {
  const res = [];
  let cur = '';
  let inQ = false;
  for (const ch of line) {
    if (ch === '"') inQ = !inQ;
    else if (ch === ',' && !inQ) { res.push(cur); cur = ''; }
    else cur += ch;
  }
  res.push(cur);
  return res;
}

function fetchT(url, ms = 15000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { cache: 'no-store', signal: ctrl.signal }).finally(() => clearTimeout(timer));
}

function fmtKes(n, decimals = 2) {
  return (typeof n === 'number' && !isNaN(n) ? n : 0).toLocaleString('en-KE', {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals
  });
}

function getGreeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Good morning — starting the month or day early keeps your compounding ahead of schedule.';
  if (h < 17) return 'Good afternoon — steady monthly contributions build lasting financial momentum.';
  return 'Good evening — a quick check-in today keeps your savings goals on track.';
}

function GrowthChart({ alias, data, month, theme, members, mode }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || !data) return;
    if (chartRef.current) chartRef.current.destroy();

    const idx = Math.max(0, MONTHS.indexOf(month));
    const labels = MONTHS.map(m => m.slice(0, 3));
    const bars = [];
    const actualLine = [];
    let cumTopups = 0;

    for (let i = 0; i <= idx; i++) {
      const mName = MONTHS[i];
      if (mode === 'group') {
        const t = members.reduce((s, a) => s + (data[mName]?.[a]?.topups || 0), 0);
        const b = members.reduce((s, a) => s + (data[mName]?.[a]?.closingBalance || 0), 0);
        bars.push(t);
        actualLine.push(b);
        cumTopups += t;
      } else {
        const row = data[mName]?.[alias] || { topups: 0, closingBalance: 0 };
        bars.push(row.topups);
        actualLine.push(row.closingBalance);
        cumTopups += row.topups;
      }
    }

    const avgMonthly = cumTopups / (idx + 1) || MIN_CONTRIB;
    const barSeries = [...bars, ...Array(11 - idx).fill(null)];
    const lineSeries = [...actualLine, ...Array(11 - idx).fill(null)];
    const projSeries = Array(12).fill(null);
    projSeries[idx] = actualLine[idx] || 0;
    for (let i = idx + 1; i < 12; i++) {
      projSeries[i] = (projSeries[i - 1] + avgMonthly) * (1 + ETICA_MONTHLY);
    }

    const tickColor = theme === 'light' ? 'rgba(15,23,42,0.58)' : 'rgba(242,245,250,0.55)';
    const gridColor = theme === 'light' ? 'rgba(15,23,42,0.06)' : 'rgba(255,255,255,0.06)';

    chartRef.current = new Chart(canvasRef.current.getContext('2d'), {
      data: {
        labels,
        datasets: [
          {
            type: 'bar',
            label: mode === 'group' ? 'Group Top-ups' : 'Monthly Top-ups',
            data: barSeries,
            backgroundColor: 'rgba(86, 194, 82, 0.72)',
            borderRadius: 5,
            order: 3
          },
          {
            type: 'line',
            label: 'Balance',
            data: lineSeries,
            borderColor: '#56c252',
            borderWidth: 2.5,
            pointRadius: 3,
            tension: 0.3,
            spanGaps: false,
            order: 1
          },
          {
            type: 'line',
            label: 'Projected',
            data: projSeries,
            borderColor: '#4b91ff',
            borderWidth: 2,
            borderDash: [5, 4],
            pointRadius: 2.5,
            tension: 0.3,
            spanGaps: false,
            order: 2
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: {
            position: 'top',
            labels: { color: tickColor, boxWidth: 10, font: { size: 11, family: 'DM Sans' } }
          },
          tooltip: {
            callbacks: {
              label: ctx => ctx.parsed.y == null ? null : `${ctx.dataset.label}: KES ${Math.round(ctx.parsed.y).toLocaleString()}`
            }
          }
        },
        scales: {
          x: { ticks: { color: tickColor, font: { size: 10 } }, grid: { display: false } },
          y: {
            beginAtZero: true,
            ticks: {
              color: tickColor,
              font: { size: 10 },
              callback: v => 'KES ' + Math.round(v / 1000) + 'k'
            },
            grid: { color: gridColor }
          }
        }
      }
    });

    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [alias, data, month, theme, members, mode]);

  return <div style={{ height: 215, position: 'relative' }}><canvas ref={canvasRef} /></div>;
}

    const saved = localStorage.getItem('mmf_theme');

    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  });
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [tab, setTab] = useState('overview');
  const [month, setMonth] = useState(curMonth);
  const [alias, setAlias] = useState('');
  const [members, setMembers] = useState(FALLBACK_MEMBERS);
  const [pairs, setPairs] = useState(FALLBACK_PAIRS);
  const [cityIcon, setCityIcon] = useState(CITY_ICON);
  const [statementSummary, setStatementSummary] = useState('');

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('mmf_theme', theme);
  }, [theme]);

  const loadData = useCallback(async () => {
    try {
      setLoading(true);
      setError(null);

      let liveMembers = FALLBACK_MEMBERS;
      let livePairs = FALLBACK_PAIRS;
      let liveIcons = { ...CITY_ICON };

      try {
        const mr = await fetchT(MEMBERS_URL + '&_=' + Date.now());
        const mtxt = await mr.text();
        const mlines = mtxt.split('\n').filter(l => l.trim());
        if (mlines.length > 1) {
          const headers = parseRow(mlines[0]).map(h => h.trim().toLowerCase().replace(/"/g, ''));
          const iA = Math.max(0, headers.findIndex(h => h.includes('alias') || h.includes('name')));
          const iI = headers.findIndex(h => h.includes('icon') || h.includes('emoji'));
          const iP = headers.findIndex(h => h.includes('pair') || h.includes('partner'));
          const parsedMembers = [];
          const parsedPairs = {};
          mlines.slice(1).forEach(line => {
            const cols = parseRow(line);
            const name = cols[iA]?.trim().replace(/"/g, '');
            if (!name) return;
            parsedMembers.push(name);
            const icon = iI >= 0 ? cols[iI]?.trim().replace(/"/g, '') : '';
            liveIcons[name] = icon || CITY_ICON[name] || '👤';
            if (iP >= 0 && cols[iP]?.trim()) parsedPairs[name] = cols[iP].trim().replace(/"/g, '');
          });
          if (parsedMembers.length > 0) {
            liveMembers = parsedMembers;
            livePairs = parsedPairs;
            setMembers(parsedMembers);
            setPairs(parsedPairs);
            setCityIcon(liveIcons);
          }
        }
      } catch (_) {
        // Keep fallback members
      }

      const curIdx = new Date().getMonth();
      const activeMonths = MONTHS.slice(0, curIdx + 1);
      const parsedData = {};
      let okCount = 0;

      await Promise.all(activeMonths.map(async m => {
        try {
          const resp = await fetchT(MONTH_URLS[m] + '&_=' + Date.now());
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          const txt = await resp.text();
          const lines = txt.split('\n').filter(l => l.trim());
          const monthMap = {};
          for (let i = 3; i < lines.length; i++) {
            const cols = parseRow(lines[i]);
            const name = cols[0]?.trim().replace(/"/g, '');
            if (name && liveMembers.includes(name)) {
              const num = s => parseFloat((s || '').replace(/["',\s]/g, '')) || 0;
              monthMap[name] = {
                openingBalance: num(cols[1]),
                topups: num(cols[2]),
                interest: num(cols[3]),
                daysActive: parseInt((cols[4] || '').replace(/[",\s]/g, ''), 10) || 0,
                closingBalance: num(cols[5])
              };
            }
          }
          parsedData[m] = monthMap;
          okCount++;
        } catch (_) {
          parsedData[m] = {};
        }
      }));

      if (okCount === 0) throw new Error('Unable to load monthly sheet data.');
      setData(parsedData);
      setLoading(false);
    } catch (err) {
      setError(err.message || 'Failed to load tracker data.');
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    if (auth) loadData();
  }, [auth, loadData]);

  if (!auth) return <PwScreen onOK={() => setAuthState(true)} />;

  if (loading) {
    return (
      <div className="loader-box">
        <div className="spinner" />
        <div>Loading MMF balances…</div>
      </div>
    );
  }

  if (error || !data) {
    return (

        <button className="primary-btn" style={{ maxWidth: 180 }} onClick={loadData}>Retry</button>

              <span className="kv-lbl">Opening Balance</span>
              <span className="kv-val">KES {fmtKes(memberRow.openingBalance)}</span>
            </div>
            <div className="kv-row">
              <span className="kv-lbl">{month} Top-ups</span>
              <span className="kv-val" style={{ color: 'var(--bl)' }}>KES {fmtKes(memberRow.topups)}</span>
            </div>
            <div className="kv-row">
              <span className="kv-lbl">Interest Earned</span>
              <span className="kv-val" style={{ color: 'var(--ac)' }}>KES {fmtKes(memberRow.interest)}</span>
            </div>
          </section>

          {shortfall > 0 && (
            <section className="surface-card" style={{ borderColor: 'rgba(255,170,43,0.35)', background: 'var(--gd-soft)' }}>
              <div style={{ fontSize: '0.82rem', fontWeight: 700, color: 'var(--gd)', marginBottom: 4 }}>
                ⚠️ Contribution Reminder
              </div>
              <p style={{ fontSize: '0.83rem', color: 'var(--t2)', lineHeight: 1.5 }}>
                {partner ? `Combined ${activeAlias} + ${partner} deposits` : `${activeAlias} deposits`} in {month} are at <strong>KES {fmtKes(effectiveTopup, 0)}</strong>. Add <strong>KES {fmtKes(shortfall, 0)}</strong> to hit KES 4,000.
              </p>
            </section>
          )}

          <section className="surface-card">
            <div className="hero-kicker" style={{ textAlign: 'left', marginBottom: 8 }}>
              {activeAlias} Balance &amp; Projection · {month}
            </div>
            <GrowthChart alias={activeAlias} data={data} month={month} theme={theme} members={members} mode="member" />
          </section>
        </>
      )}

      {tab === 'accrual' && (
        <div className="tbl-card">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Alias</th>
                <th>Opening</th>
                <th>Top-ups</th>
                <th>Int.</th>
                <th>Balance</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r, i) => {
                const dot = r.topups >= MIN_CONTRIB ? 'var(--ac)' : r.topups > 0 ? 'var(--gd)' : 'var(--rd)';
                return (
                  <tr key={r.alias}>
                    <td>{i + 1}</td>
                    <td style={{ fontWeight: 700 }}>{cityIcon[r.alias] || '👤'} {r.alias}</td>
                    <td className="mono">{fmtKes(r.openingBalance, 0)}</td>
                    <td className="mono">
                      {fmtKes(r.topups, 0)}
                      <span className="status-dot" style={{ background: dot }} />
                    </td>
                    <td className="mono" style={{ color: 'var(--ac)' }}>{fmtKes(r.interest, 0)}</td>
                    <td className="mono" style={{ fontWeight: 700, color: 'var(--t1)' }}>{fmtKes(r.closingBalance, 0)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {tab === 'statements' && (
        <section className="surface-card">
          <div className="hero-kicker" style={{ textAlign: 'left', marginBottom: 10 }}>
            Member YTD Statement
          </div>
          <div className="info-box">
            <strong>Alias:</strong> {cityIcon[activeAlias] || '👤'} {activeAlias}<br />
            <strong>Etica Statement Password:</strong> <span style={{ fontFamily: 'var(--font-mono)' }}>308398</span>
          </div>
          <button className="primary-btn" onClick={openYtdStatement}>
            Generate {activeAlias} Statement ({CUR_YEAR})
          </button>
          {statementSummary && (
            <div className="info-box" style={{ marginTop: 12, borderColor: 'var(--ac-border)', background: 'var(--ac-soft)', color: 'var(--t1)' }}>
              {statementSummary}
            </div>
          )}
        </section>
      )}

      {tab === 'info' && (
        <>
          <section className="surface-card">
            <div className="hero-kicker" style={{ textAlign: 'left', marginBottom: 10 }}>
              Deposit Instructions · Ref 308398M
            </div>
            <div className="info-box">
              <strong>M-PESA Paybill:</strong> <span style={{ fontFamily: 'var(--font-mono)' }}>4096483</span><br />
              <strong>Account Number:</strong> <span style={{ fontFamily: 'var(--font-mono)' }}>308398M</span>
            </div>
            <div className="info-box" style={{ marginBottom: 0 }}>
              <strong>Equity Bank:</strong> Etica Unit Trust Collection<br />
              <strong>Account:</strong> <span style={{ fontFamily: 'var(--font-mono)' }}>0180 28395 1027</span> · Ref <strong>308398M</strong>
            </div>
          </section>

          <section className="surface-card">
            <div className="hero-kicker" style={{ textAlign: 'left', marginBottom: 6 }}>
              Group Rules
            </div>
            <div className="rule-item"><span>Minimum contribution</span><strong>KES 4,000/month</strong></div>
            <div className="rule-item"><span>Interest rule</span><strong>Full minimum met</strong></div>
            <div className="rule-item"><span>Withdrawal window</span><strong>5–21 Dec</strong></div>
            <div className="rule-item"><span>Fund</span><strong>Etica MMF</strong></div>
          </section>
        </>
      )}

      <nav className="bottom-dock" aria-label="Bottom navigation">
        <button className={`dock-item ${tab === 'overview' ? 'active' : ''}`} onClick={() => setTab('overview')}>
          <span className="dock-icon">🏠</span>
          <span>Overview</span>
        </button>
        <button className={`dock-item ${tab === 'balance' ? 'active' : ''}`} onClick={() => setTab('balance')}>
          <span className="dock-icon">💼</span>
          <span>My Balance</span>
        </button>
        <button className={`dock-item ${tab === 'statements' ? 'active' : ''}`} onClick={() => setTab('statements')}>
          <span className="dock-icon">📄</span>
          <span>Statements</span>
        </button>
      </nav>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
